spring.application.name=educore
spring.config.import=optional:file:.env[.properties],optional:file:student-management/.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/studentdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

logging.level.root=INFO
logging.level.com.rishi.student_management=DEBUG
logging.level.org.springframework.security=INFO
logging.file.name=logs/student-management.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger - %msg%n

jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
